services:
  - type: web
    name: secure-dms-demo
    runtime: docker
    plan: starter
    dockerfilePath: ./secure-dms/Dockerfile
    dockerContext: ./secure-dms
    healthCheckPath: /login
    disk:
      name: secure-dms-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DMS_STORAGE_ROOT
        value: /var/data/secure-dms
      - key: DMS_DB_URL
        value: "jdbc:h2:file:/var/data/secure-dms/db;MODE=MySQL;DATABASE_TO_LOWER=TRUE"
      - key: DMS_DEMO_PASSWORD
        sync: false