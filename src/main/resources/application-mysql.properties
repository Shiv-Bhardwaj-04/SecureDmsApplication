spring.datasource.url=${DMS_DB_URL:jdbc:mysql://localhost:3306/secure_dms?createDatabaseIfNotExist=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DMS_DB_USERNAME:root}
# Set DMS_DB_PASSWORD before starting with the mysql profile.
spring.datasource.password=${DMS_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
