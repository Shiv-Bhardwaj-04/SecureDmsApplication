spring.application.name=secure-dms
spring.datasource.url=${DMS_DB_URL:jdbc:h2:file:./data/secure-dms/db;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DMS_DB_USERNAME:sa}
spring.datasource.password=${DMS_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
server.port=${PORT:8080}
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

# Encrypted blobs live outside the web root and are never served directly.
dms.storage.root=${DMS_STORAGE_ROOT:./data/secure-dms}
dms.demo.password=${DMS_DEMO_PASSWORD:Demo@123}
